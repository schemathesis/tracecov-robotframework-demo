[project]
name = "tracecov-robotframework-demo"
version = "0"
requires-python = ">=3.11"
dependencies = [
    "robotframework>=7.0",
    "robotframework-requests",
    "robotframework-pabot",
    "robotframework-schemathesislibrary",
    "tracecov>=0.26",
    "tracecov-professional",
    "requests",
]

[tool.uv]
package = false

# TraceCov Professional is not on PyPI: put the wheels you were sent into `wheels/`.
[[tool.uv.index]]
name = "wheels"
url = "wheels"
format = "flat"
explicit = true

[tool.uv.sources]
tracecov-professional = { index = "wheels" }

[tool.ruff]
line-length = 120
